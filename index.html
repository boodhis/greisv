<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровая Крепость</title>
<meta name="description" content="Образовательный сайт о Linux, homelab и самостоятельном администрировании. Крепость, Homelab, Электрика, Обучение и Заметки. Работает офлайн и бесплатно, без трекеров.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f1e8">
<style>
:root{
  --bg:#f4f1e8;
  --panel:#fbf9f3;
  --line:#d8d3c2;
  --text:#1c1c1a;
  --dim:#6b6659;
  --accent:#0a5c52;
  --hover:#ebe6d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Iowan Old Style",Charter,"Liberation Serif",serif;
  line-height:1.7;
  font-size:20px;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.wrap{max-width:1120px;margin:0 auto;padding:16px 24px 48px}

/* шапка */
header{margin:30px 0 0}
.logo{
  font-size:34px;
  font-weight:700;
  line-height:1.2;
  color:var(--accent);
  letter-spacing:.6px;
}
.lede{
  margin:10px 0 0;
  max-width:660px;
  font-size:19px;
  color:var(--dim);
}

/* список разделов */
.list{
  margin:30px 0 0;
  border:1px solid var(--line);
  border-radius:3px;
  background:var(--panel);
  overflow:hidden;
}
.row{
  position:relative;
  display:flex;
  align-items:baseline;
  gap:14px;
  padding:18px 22px;
  border-bottom:1px solid var(--line);
  color:var(--text);
  font-size:19px;
  transition:background-color .15s ease;
}
.row::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--c,var(--accent));
  opacity:0;
  transition:opacity .15s ease;
}
.row:last-child{border-bottom:0}
.row:hover,.row:focus-visible{background:var(--hover);text-decoration:none}
.row:hover::before,.row:focus-visible::before{opacity:1}
.row b{font-weight:700}
.row .tag{color:var(--dim);font-size:16px}
.row .cnt{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  color:var(--dim);
  font-size:16px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.row .arw{font-style:normal;transition:transform .15s ease}
.row:hover .arw{transform:translateX(3px)}

/* подвал */
footer{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-top:38px;
  padding-top:16px;
  border-top:1px solid var(--line);
  color:var(--dim);
  font-size:16px;
}

@media (max-width:560px){
  body{font-size:18px}
  .logo{font-size:28px}
  .row{flex-wrap:wrap;font-size:17px}
  .row .tag{order:3;flex-basis:100%;font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Цифровая Крепость</div>
    <p class="lede">война с энтропией</p>
  </header>

  <nav class="list" aria-label="Разделы сайта">

    <a class="row" href="getting-started/index.html" style="--c:#3d5c2c">
      <b>Крепость</b>
      <span class="tag">манифест · ubuntu · первые шаги</span>
      <span class="cnt">4<span class="arw" aria-hidden="true">→</span></span>
    </a>

    <a class="row" href="homelab/index.html" style="--c:#0a5c52">
      <b>Homelab</b>
      <span class="tag">железо · сеть · сервисы · гайды</span>
      <span class="cnt">22<span class="arw" aria-hidden="true">→</span></span>
    </a>

    <a class="row" href="electric/index.html" style="--c:#7a2f6b">
      <b>Электрика</b>
      <span class="tag">безопасность · щиты · нормативы</span>
      <span class="cnt">7<span class="arw" aria-hidden="true">→</span></span>
    </a>

    <a class="row" href="study/index.html" style="--c:#7d611b">
      <b>Обучение</b>
      <span class="tag">python · devops · шпаргалки</span>
      <span class="cnt">12<span class="arw" aria-hidden="true">→</span></span>
    </a>

    <a class="row" href="articles/index.html" style="--c:#6b6659">
      <b>Заметки</b>
      <span class="tag">эссе · книги · досуг</span>
      <span class="cnt">5<span class="arw" aria-hidden="true">→</span></span>
    </a>

  </nav>

  <footer>
    <span>Своими руками, с резервными копиями.</span>
    <a href="manifest.html">Манифест</a>
  </footer>

</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
